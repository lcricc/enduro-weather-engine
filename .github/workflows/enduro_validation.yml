
name: ENDURO MeteoHub Scientific Validation

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - ENDURO Permanent Archive
    types:
      - completed
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: enduro-scientific-validation
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Record validation job start
        run: echo "ENDURO_VALIDATION_JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download historical GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p historical/observations
          mkdir -p historical/forecasts
          mkdir -p data/forecasts/national
          mkdir -p data/observations/meteohub/clean

          gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 100 \
            --json tagName,publishedAt \
            --jq '.[] | [.tagName, .publishedAt] | @tsv' \
            > /tmp/enduro_tags.txt

          OBS_COUNT=0
          FC_COUNT=0

          while IFS=$'\t' read -r TAG PUBLISHED; do
            case "$TAG" in

              meteohub-observations-*)
                DEST="historical/observations/$TAG"
                mkdir -p "$DEST"

                gh release download "$TAG" \
                  --repo "$GITHUB_REPOSITORY" \
                  --pattern 'observations-*.tar.gz' \
                  --dir "$DEST"

                for FILE in "$DEST"/*.tar.gz; do
                  test -f "$FILE" || continue
                  tar -xzf "$FILE" -C "$DEST"
                  rm -- "$FILE"
                done

                OBS_COUNT=$((OBS_COUNT + 1))
                ;;

              meteohub-forecasts-*)
                DEST="historical/forecasts/$TAG"
                mkdir -p "$DEST"
                echo "$PUBLISHED" > "$DEST/published_at.txt"

                gh release download "$TAG" \
                  --repo "$GITHUB_REPOSITORY" \
                  --pattern 'forecasts-*.tar.gz' \
                  --dir "$DEST"

                for FILE in "$DEST"/*.tar.gz; do
                  test -f "$FILE" || continue
                  tar -xzf "$FILE" -C "$DEST"
                  rm -- "$FILE"
                done

                FC_COUNT=$((FC_COUNT + 1))
                ;;

            esac
          done < /tmp/enduro_tags.txt

          echo "Observation releases: $OBS_COUNT"
          echo "Forecast releases: $FC_COUNT"

          test "$OBS_COUNT" -gt 0
          test "$FC_COUNT" -gt 0

      - name: Merge historical observations
        shell: bash
        run: |
          /usr/bin/time -v python merge_historical_observations.py

      - name: Prepare historical forecasts
        shell: bash
        run: |
          set -euo pipefail

          COUNT=0

          while IFS= read -r -d '' FILE; do
            NAME=$(basename "$FILE")
            DEST="data/forecasts/national/$NAME"

            if [ -f "$DEST" ]; then
              if ! cmp -s "$FILE" "$DEST"; then
                echo "Conflicting forecast: $NAME"
                exit 1
              fi
            else
              cp "$FILE" "$DEST"
              COUNT=$((COUNT + 1))
            fi

          done < <(
            find historical/forecasts \
              -type f \
              -name 'forecasts_meteohub_*.csv.gz' \
              -print0
          )

          echo "Historical forecast files: $COUNT"
          test "$COUNT" -gt 0

      - name: Load the preceding rain recovery plan
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=$(gh run list --workflow enduro_validation.yml --branch main \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          [ -n "$run_id" ] || exit 0
          gh run download "$run_id" --name "enduro-validation-$run_id" \
            --dir "$RUNNER_TEMP/previous-rain-recovery"
          plan="$RUNNER_TEMP/previous-rain-recovery/rain_recovery_plan.json"
          if [ -f "$plan" ]; then
            mkdir -p data/validation/previous_rain_recovery
            cp "$plan" data/validation/previous_rain_recovery/
          fi

      - name: Run scientific validation
        id: validate
        run: >-
          python scripts/measure_meteohub_validation.py
          --profile data/validation/meteohub/run_profile.json
          -- python -u validate_meteohub.py

      - name: Record validation Job Summary
        if: always()
        env:
          VALIDATION_OUTCOME: ${{ steps.validate.outcome }}
        run: >-
          python scripts/measure_meteohub_validation.py
          --profile data/validation/meteohub/run_profile.json
          --summary "$VALIDATION_OUTCOME" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scientific validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enduro-validation-${{ github.run_id }}
          path: data/validation/meteohub/
          if-no-files-found: warn
          retention-days: 90
