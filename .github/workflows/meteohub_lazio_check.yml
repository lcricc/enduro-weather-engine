name: ENDURO MeteoHub Lazio Request Check

on:
  push:
    branches: [meteohub-primo-confronto]
    paths: [.github/workflows/meteohub_lazio_check.yml]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 89575287681bf340220de6588f2104b0948f89b6
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reproduce the original request and report its response
        id: request
        env:
          METEOHUB_USERNAME: ${{ secrets.METEOHUB_USERNAME }}
          METEOHUB_PASSWORD: ${{ secrets.METEOHUB_PASSWORD }}
        run: |
          python -u - <<'PY'
          import json
          import os
          from urllib.error import HTTPError
          from urllib.parse import urlencode

          from meteohub_request_all import api, login

          def checked(path, token, payload=None, *, label):
              try:
                  return api(path, token, payload)
              except HTTPError as error:
                  body = error.read(1500)
                  try:
                      value = json.loads(body)
                      detail = value.get("message") or value.get("detail") or value.get("error")
                  except (ValueError, AttributeError):
                      detail = None
                  print(f"{label}: HTTP {error.code} {str(detail)[:250]}", flush=True)
                  return None

          def fields(network, start, end, token, *, rain=False, bbox=None):
              expression = f"reftime: >={start},<={end};"
              if rain:
                  expression += "product:B13011;"
              query = {"datasets": network, "q": expression, "onlySummaryStats": "true"}
              if bbox:
                  query.update(bbox)
              data = checked("/api/fields?" + urlencode(query), token, label=f"Stima {network}")
              if isinstance(data, dict):
                  print(f"Stima {network} {start}–{end}: {data}", flush=True)
                  return data

          token = login()
          usage = api("/api/usage", token)
          quota = api("/api/hourly", token)
          free = usage["quota"] - usage["used"]
          print(f"Spazio MeteoHub disponibile: {free} byte su {usage['quota']}. Richieste residue: {quota['remaining']}.")

          start, end = "2026-11-14 17:32:46", "2026-11-15 19:32:46"
          estimate = fields("mnw", start, end, token)
          if estimate and estimate.get("s", 0) * 2.8 > 5 * free and quota["remaining"] > 0:
              answer = checked("/api/data", token, {
                  "request_name": "enduro-check-mnw-replay-20261115",
                  "dataset_names": ["mnw"],
                  "reftime": {"from": "2026-11-14T17:32:46.000Z", "to": "2026-11-15T19:32:46.000Z"},
                  "output_format": "json",
                  "only_reliable": True,
              }, label="Ripetizione richiesta ordinaria mnw")
              if answer is not None:
                  print(f"Ripetizione richiesta ordinaria mnw accettata: {answer.get('request_id')}")
          else:
              print("Ripetizione richiesta ordinaria mnw: stima o quota indisponibile.")
          ids = ["5882781"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              print("ids=" + ",".join(ids), file=stream)
          PY
      - name: Verify measurements returned for Lazio
        if: steps.request.outputs.ids != ''
        env:
          METEOHUB_USERNAME: ${{ secrets.METEOHUB_USERNAME }}
          METEOHUB_PASSWORD: ${{ secrets.METEOHUB_PASSWORD }}
          REQUEST_IDS: ${{ steps.request.outputs.ids }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          mkdir -p targeted
          cd targeted
          python "$GITHUB_WORKSPACE/meteohub_collect.py" --request-ids "$REQUEST_IDS" --wait-seconds 180
          python "$GITHUB_WORKSPACE/meteohub_clean.py"
          python - <<'PY'
          import csv
          from collections import Counter
          from pathlib import Path
          with Path("data/observations/meteohub/clean/observations_clean.csv").open() as source:
              rows = list(csv.DictReader(source))
          rain = [row for row in rows if row["variable"] == "B13011"]
          stations = {(row["network"], row["station_id"], row["station_name"]) for row in rain}
          print("Misure pioggia per rete:", dict(Counter(r["network"] for r in rain)))
          print("Stazioni pioggia:", sorted(stations))
          from validate_meteohub import load_approved, add_precipitation_interval, hourly_precipitation, signature, timestamp
          from collections import defaultdict
          import json

          import os
          import validate_meteohub
          validate_meteohub.APPROVED = Path(os.environ["GITHUB_WORKSPACE"]) / "meteohub_approved_metadata.json"
          approved = load_approved()
          intervals = defaultdict(dict)
          stats = Counter()
          names = {(network, station): name for network, station, name in stations}
          for row in rain:
              tr = json.loads(row["timerange"])
              level = json.loads(row["level"])
              if signature("B13011", level, tr) in approved:
                  add_precipitation_interval(
                      intervals, row["network"], row["station_id"],
                      timestamp(row["time_utc"]), tr[2], float(row["value"]), stats
                  )
          print("Accumulazioni complete:", sorted(
              (names[(network, station)], end.isoformat(), round(value, 4))
              for (network, station, end, _), value in hourly_precipitation(intervals, stats).items()
          ))
          PY
      - name: Keep the diagnostic sample
        if: always() && steps.request.outputs.ids != ''
        uses: actions/upload-artifact@v4
        with:
          name: meteohub-lazio-request-check
          path: targeted/data/observations/meteohub/
          if-no-files-found: ignore
          retention-days: 7
