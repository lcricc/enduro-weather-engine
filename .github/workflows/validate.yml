
name: ENDURO Validate Forecasts

on:
  workflow_dispatch:
  schedule:
    - cron: '20 8 * * *'

permissions:
  contents: write

concurrency:
  group: enduro-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update NOAA observations
        run: python collect_noaa.py

      - name: Retrieve forecast archive
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin forecast-archive
          mkdir -p data/forecasts/national
          git archive FETCH_HEAD data/forecasts/national | tar -xf -

      - name: Validate archived forecasts
        run: python validate_forecasts.py

      - name: Commit observations and validation report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add data/observations/noaa/
          git add data/validation/validation_latest.json

          if ! git diff --cached --quiet; then
            git commit -m 'Update NOAA observations and forecast validation'
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No changes to commit"
          fi

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: data/validation/validation_latest.json
          if-no-files-found: warn
