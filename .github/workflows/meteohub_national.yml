
name: MeteoHub - Catalogo nazionale

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalogo:
    runs-on: ubuntu-latest

    steps:
      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Leggi inventario dataset
        env:
          METEOHUB_USERNAME: ${{ secrets.METEOHUB_USERNAME }}
          METEOHUB_PASSWORD: ${{ secrets.METEOHUB_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          from pathlib import Path

          base = "https://meteohub.agenziaitaliameteo.it"
          output = Path("national_catalog")
          output.mkdir(exist_ok=True)

          def request_json(path, token=None, payload=None):
              headers = {"Accept": "application/json"}
              data = None

              if token:
                  headers["Authorization"] = "Bearer " + token

              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
                  headers["Content-Type"] = "application/json"

              request = urllib.request.Request(
                  base + path,
                  data=data,
                  headers=headers
              )

              with urllib.request.urlopen(
                  request, timeout=60
              ) as response:
                  return json.load(response)

          login = request_json(
              "/auth/login",
              payload={
                  "username": os.environ["METEOHUB_USERNAME"],
                  "password": os.environ["METEOHUB_PASSWORD"]
              }
          )

          if isinstance(login, str):
              token = login
          else:
              token = (
                  login.get("access_token")
                  or login.get("token")
              )

          if not token:
              raise RuntimeError("Token non disponibile")

          datasets = request_json("/api/datasets", token)

          if not isinstance(datasets, list):
              raise RuntimeError("Formato catalogo inatteso")

          allowed = {
              "id", "name", "title", "description",
              "code", "identifier", "network",
              "region", "provider", "organization",
              "type", "category", "dataset_id",
              "network_id", "label"
          }

          inventory = []

          for index, dataset in enumerate(datasets):
              entry = {"index": index + 1}

              if isinstance(dataset, dict):
                  entry["available_fields"] = sorted(
                      dataset.keys()
                  )

                  for key, value in dataset.items():
                      if key.lower() in allowed:
                          if isinstance(value, (str, int, float, bool)):
                              entry[key] = (
                                  value[:500]
                                  if isinstance(value, str)
                                  else value
                              )
              else:
                  entry["value_type"] = type(dataset).__name__

              inventory.append(entry)

          report = {
              "source": "MeteoHub",
              "total_datasets": len(datasets),
              "inventory": inventory
          }

          path = output / "national_inventory.json"

          with path.open("w", encoding="utf-8") as f:
              json.dump(
                  report, f,
                  ensure_ascii=False,
                  indent=2
              )

          print("Dataset trovati:", len(datasets))
          print("Inventario salvato:", path)
          PY

      - name: Conserva inventario nazionale
        uses: actions/upload-artifact@v4
        with:
          name: meteohub-inventario-nazionale
          path: national_catalog/national_inventory.json
          if-no-files-found: error
          retention-days: 90
