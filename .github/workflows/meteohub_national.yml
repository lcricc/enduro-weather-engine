
name: MeteoHub - Catalogo nazionale

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalogo:
    runs-on: ubuntu-latest

    steps:
      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Esamina catalogo MeteoHub
        env:
          METEOHUB_USERNAME: ${{ secrets.METEOHUB_USERNAME }}
          METEOHUB_PASSWORD: ${{ secrets.METEOHUB_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error
          from pathlib import Path

          BASE = "https://meteohub.agenziaitaliameteo.it"
          OUT = Path("national_catalog")
          OUT.mkdir(exist_ok=True)

          def get_json(path, token=None, payload=None):
              headers = {"Accept": "application/json"}
              if token:
                  headers["Authorization"] = "Bearer " + token

              data = None
              method = "GET"

              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
                  headers["Content-Type"] = "application/json"
                  method = "POST"

              request = urllib.request.Request(
                  BASE + path,
                  data=data,
                  headers=headers,
                  method=method
              )

              with urllib.request.urlopen(
                  request, timeout=45
              ) as response:
                  return json.load(response)

          username = os.environ.get("METEOHUB_USERNAME")
          password = os.environ.get("METEOHUB_PASSWORD")

          if not username or not password:
              raise RuntimeError("Credenziali mancanti")

          login = get_json(
              "/auth/login",
              payload={
                  "username": username,
                  "password": password
              }
          )

          if isinstance(login, str):
              token = login
          elif isinstance(login, dict):
              token = (
                  login.get("access_token")
                  or login.get("token")
              )
          else:
              token = None

          if not token:
              raise RuntimeError("Login MeteoHub fallito")

          print("METEOHUB: autenticazione riuscita")

          # Solo endpoint di lettura.
          # Alcuni percorsi sono candidati da verificare,
          # non endpoint già confermati.
          endpoints = [
              "/api/datasets",
              "/api/dataset",
              "/api/networks",
              "/api/stations",
              "/api/metadata"
          ]

          results = []

          for path in endpoints:
              entry = {
                  "endpoint": path,
                  "http_status": None,
                  "response_type": None,
                  "top_level_keys": [],
                  "items": None
              }

              try:
                  response = get_json(path, token)
                  entry["http_status"] = 200
                  entry["response_type"] = type(
                      response
                  ).__name__

                  if isinstance(response, list):
                      entry["items"] = len(response)

                  elif isinstance(response, dict):
                      entry["top_level_keys"] = sorted(
                          response.keys()
                      )

                      # Non esportiamo i valori ricevuti:
                      # solo la struttura della risposta.

                  print(path, "HTTP 200")

              except urllib.error.HTTPError as error:
                  entry["http_status"] = error.code
                  print(path, "HTTP", error.code)

              except (
                  urllib.error.URLError,
                  TimeoutError,
                  ValueError
              ) as error:
                  entry["error_type"] = type(
                      error
                  ).__name__
                  print(
                      path,
                      type(error).__name__
                  )

              results.append(entry)

          report = {
              "source": "MeteoHub",
              "purpose": "National API discovery",
              "endpoints": results
          }

          destination = OUT / "endpoint_report.json"

          with destination.open(
              "w", encoding="utf-8"
          ) as file:
              json.dump(
                  report,
                  file,
                  indent=2,
                  ensure_ascii=False
              )

          print("Rapporto salvato:", destination)
          print("Diagnostica nazionale completata")
          PY

      - name: Conserva rapporto catalogo
        uses: actions/upload-artifact@v4
        with:
          name: meteohub-catalogo-endpoint
          path: national_catalog/endpoint_report.json
          if-no-files-found: error
          retention-days: 90
