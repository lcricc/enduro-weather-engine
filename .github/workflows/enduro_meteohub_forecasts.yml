
name: ENDURO MeteoHub Forecasts V2

on:
  workflow_dispatch:
    inputs:
      regional_observation_run:
        description: "ID raccolta MeteoHub per includere le stazioni di Liguria, Lombardia, Marche e Molise"
        required: false
        type: string
  schedule:
    - cron: "15 4 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: enduro-meteohub-forecasts
  cancel-in-progress: false

jobs:
  meteohub-forecasts:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Find latest station inventory
        id: inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          RUN_ID=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow meteohub_stations.yml \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')

          if [ -z "$RUN_ID" ]; then
            echo "No successful station inventory"
            exit 1
          fi

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download MeteoHub stations
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.inventory.outputs.run_id }}
        run: |
          set -euo pipefail

          mkdir -p data/observations/meteohub

          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'meteohub-station-analysis*' \
            --dir downloaded

          FOUND=$(find downloaded \
            -type f \
            -name stations_meteohub.csv \
            -print -quit)

          if [ -z "$FOUND" ]; then
            echo "Station inventory missing"
            exit 1
          fi

          cp "$FOUND" \
            data/observations/meteohub/stations_meteohub.csv

          echo "Stations available:"
          wc -l data/observations/meteohub/stations_meteohub.csv

      - name: Add regional stations with hourly observations
        if: ${{ inputs.regional_observation_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.regional_observation_run }}
        run: |
          set -euo pipefail
          if [[ ! "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "Indicare l'ID numerico di una raccolta MeteoHub"
            exit 1
          fi

          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'meteohub-observations-*' \
            --dir regional-observations

          FOUND=$(find regional-observations -type f -name observations_clean.csv -print -quit)
          if [[ -z "$FOUND" ]]; then
            echo "La raccolta selezionata è priva di osservazioni pulite"
            exit 1
          fi

          DIR=data/observations/meteohub
          mkdir -p "$DIR/clean"
          cp "$FOUND" "$DIR/clean/observations_clean.csv"
          cp "$DIR/stations_meteohub.csv" "$DIR/stations_original.csv"
          python prepare_meteohub_stations.py

          python - <<'PY'
          import csv
          from collections import Counter, defaultdict
          from datetime import timedelta

          from prepare_meteohub_stations import FIELDS, OUTPUT
          from validate_meteohub import VARIABLES, load_approved, load_observations

          networks = ("dpcn-liguria", "dpcn-lombardia", "dpcn-marche", "dpcn-molise")
          per_network = 10

          with OUTPUT.open(encoding="utf-8-sig", newline="") as source:
              candidates = {(row["network"], row["station_id"]): row for row in csv.DictReader(source)}
          with OUTPUT.with_name("stations_original.csv").open(encoding="utf-8-sig", newline="") as source:
              stations = {(row["network"], row["station_id"]): row for row in csv.DictReader(source)}

          observations, _ = load_observations(load_approved())
          latest = {}
          for network, station_id, timestamp, _ in observations:
              if network in networks and (network, station_id) in candidates:
                  latest[network] = max(timestamp, latest.get(network, timestamp))

          counts = defaultdict(Counter)
          for network, station_id, timestamp, variable in observations:
              if network in latest and timestamp > latest[network] - timedelta(hours=24):
                  key = (network, station_id)
                  if key in candidates:
                      counts[key][variable] += 1

          def rank(key):
              samples = [counts[key][variable] for variable in VARIABLES.values()]
              return -min(samples), -sum(samples), key[1]

          for network in networks:
              ranked = sorted((key for key in counts if key[0] == network), key=rank)
              if not ranked:
                  raise RuntimeError(f"Nessuna stazione oraria verificabile per {network}")
              chosen = ranked[:per_network]
              for key in chosen:
                  stations.setdefault(key, candidates[key])
              print(f"{network}: {len(chosen)} stazioni selezionate su {len(ranked)} idonee")

          with OUTPUT.open("w", encoding="utf-8", newline="") as destination:
              writer = csv.DictWriter(destination, fieldnames=FIELDS, extrasaction="ignore")
              writer.writeheader()
              writer.writerows(stations.values())
          print(f"Stazioni per la raccolta previsioni: {len(stations)}")
          PY

      - name: Prepare a national catalog from verified MeteoHub observations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/meteohub-forecast-stations"
          mkdir -p "$work/observations" "$work/forecast"
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName \
            --jq '.[].tagName' > "$work/tags.txt"

          latest_forecast=$(awk '/^meteohub-forecasts-[0-9]+$/' "$work/tags.txt" | sort -Vr | awk 'NR==1')
          previous="$work/meteohub_station_catalog.csv"
          if [[ -n "$latest_forecast" ]]; then
            gh release download "$latest_forecast" --repo "$GITHUB_REPOSITORY" \
              --pattern 'forecasts-*.tar.gz' --pattern 'forecasts-*.sha256' --dir "$work/forecast"
            (
              cd "$work/forecast"
              sha256sum -c -- *.sha256
              member=$(tar -tzf ./*.tar.gz | awk '/\/meteohub_station_catalog\.csv$/ {print}')
              if [[ -n "$member" ]]; then
                tar -xOf ./*.tar.gz "$member" > "$previous"
              fi
            )
          fi

          limit=100
          [[ ! -s "$previous" ]] || limit=8
          mapfile -t tags < <(awk '/^meteohub-observations-[0-9]+$/' "$work/tags.txt" | sort -Vr | sed -n "1,${limit}p")
          for tag in "${tags[@]}"; do
            destination="$work/observations/$tag"
            mkdir -p "$destination"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
              --pattern 'observations-*.tar.gz' --pattern 'observations-*.sha256' --dir "$destination"
            (
              cd "$destination"
              sha256sum -c -- *.sha256
              tar -xzf ./*.tar.gz --wildcards '*/observations_clean.csv'
              rm -- ./*.tar.gz
            )
          done
          python prepare_forecast_stations.py "$work/observations" \
            --previous-catalog "$previous" \
            --additional-observations data/observations/meteohub/clean/observations_clean.csv

      - name: Collect forecasts from eight models
        run: python collect_meteohub_forecasts.py

      - name: Save forecast archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enduro-meteohub-forecasts-${{ github.run_id }}
          path: data/forecasts/national/
          if-no-files-found: warn
          retention-days: 90
