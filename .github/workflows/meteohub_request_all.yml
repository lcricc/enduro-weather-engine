
name: ENDURO MeteoHub National Requests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0,6,12,18 * * *"

permissions:
  contents: read

concurrency:
  group: enduro-meteohub-national-requests
  cancel-in-progress: false

jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Request national observations
        env:
          METEOHUB_USERNAME: ${{ secrets.METEOHUB_USERNAME }}
          METEOHUB_PASSWORD: ${{ secrets.METEOHUB_PASSWORD }}
        run: python meteohub_request_all.py
