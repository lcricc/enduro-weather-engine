name: ENDURO MeteoHub Quota Check

on:
  push:
    branches:
      - meteohub-primo-confronto
    paths:
      - .github/workflows/meteohub_collect.yml

permissions:
  contents: read

jobs:
  quotas:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify MeteoHub hour and storage quotas
        env:
          METEOHUB_USERNAME: ${{ secrets.METEOHUB_USERNAME }}
          METEOHUB_PASSWORD: ${{ secrets.METEOHUB_PASSWORD }}
        run: |
          python -u - <<'PY'
          import json
          import re
          import urllib.error

          from meteohub_request_all import api, login

          def quota_fields(value):
              if isinstance(value, dict):
                  return {
                      key: quota_fields(item)
                      for key, item in value.items()
                      if re.fullmatch(r"[a-zA-Z0-9_-]+", key)
                      and not re.search(r"user|account|email|token|secret|session|api_key", key, re.I)
                  }
              if isinstance(value, list):
                  return [quota_fields(item) for item in value[:20]]
              if isinstance(value, (int, float, bool)):
                  return value
              if isinstance(value, str) and re.fullmatch(r"(?:[0-9.]+|[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.+Z-]+)", value):
                  return value
              return None

          token = login()
          for endpoint in ("/api/hourly", "/api/usage"):
              try:
                  result = api(endpoint, token)
              except urllib.error.HTTPError as error:
                  print(f"QUOTA {endpoint} HTTP {error.code}")
                  continue
              print(f"QUOTA {endpoint}: {json.dumps(quota_fields(result))}")
          PY
