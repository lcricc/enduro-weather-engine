name: ENDURO MeteoHub Automatic Collection

on:
  workflow_dispatch:
    inputs:
      request_ids:
        description: "ID MeteoHub esistenti separati da virgola (vuoto = raccolta nazionale)"
        required: false
        type: string
  schedule:
    - cron: "50 */3 * * *"
  push:
    branches: [meteohub-ciclo-nazionale]
    paths:
      - .github/workflows/meteohub_collect.yml
      - meteohub_national_cycle.py

permissions:
  contents: write
  actions: read

concurrency:
  group: enduro-meteohub-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download the latest rain-gap plan
        if: ${{ !inputs.request_ids && github.event_name != 'push' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=$(gh run list --workflow enduro_validation.yml --branch main \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          [ -n "$run_id" ] || exit 0
          gh run download "$run_id" --name "enduro-validation-$run_id" \
            --dir "$RUNNER_TEMP/rain-recovery"
      - name: Collect, verify the published GitHub copy, and free MeteoHub storage
        env:
          GH_TOKEN: ${{ github.token }}
          METEOHUB_USERNAME: ${{ secrets.METEOHUB_USERNAME }}
          METEOHUB_PASSWORD: ${{ secrets.METEOHUB_PASSWORD }}
          REQUEST_IDS: ${{ inputs.request_ids }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            python meteohub_national_cycle.py --end 2026-11-15T15:00:00+00:00 --hours 1
          else
            python meteohub_national_cycle.py --request-ids "$REQUEST_IDS"
          fi
