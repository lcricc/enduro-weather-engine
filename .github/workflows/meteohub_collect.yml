
name: ENDURO MeteoHub Automatic Collection

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1,7,13,19 * * *"

permissions:
  contents: read

concurrency:
  group: enduro-meteohub-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect MeteoHub observations
        env:
          METEOHUB_USERNAME: ${{ secrets.METEOHUB_USERNAME }}
          METEOHUB_PASSWORD: ${{ secrets.METEOHUB_PASSWORD }}
        run: python meteohub_collect.py

      - name: Archive observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meteohub-observations-${{ github.run_id }}
          path: data/observations/meteohub/
          if-no-files-found: warn
          retention-days: 90
