name: ENDURO MeteoHub Automatic Collection

on:
  push:
    branches:
      - meteohub-primo-confronto
    paths:
      - .github/workflows/meteohub_collect.yml

permissions:
  contents: read

concurrency:
  group: enduro-meteohub-precipitation-check
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Request observations for the complete precipitation hour
        id: request
        env:
          METEOHUB_USERNAME: ${{ secrets.METEOHUB_USERNAME }}
          METEOHUB_PASSWORD: ${{ secrets.METEOHUB_PASSWORD }}
          VALID_HOUR_UTC: "2026-11-15T14:00:00+00:00"
          EARLIEST_REQUEST_UTC: "2026-11-15T14:40:00+00:00"
          DEADLINE_UTC: "2026-11-15T14:53:00+00:00"
        run: |
          python -u - <<'PY'
          import os
          import time
          import urllib.error
          from datetime import datetime, timedelta, timezone

          from meteohub_request_all import api, login, utc_string

          # JSON sizes after retaining only B13011 in the preceding hour's extract.
          REGIONS_BY_EXTRACT_SIZE = (
              ("dpcn-marche", 141181),
              ("dpcn-lombardia", 301544),
              ("dpcn-molise", 329400),
              ("dpcn-liguria", 458993),
          )

          def remaining_quota(token):
              result = api("/api/hourly", token)
              if not isinstance(result, dict) or type(result.get("remaining")) is not int:
                  raise ValueError("Risposta non valida dal contatore delle richieste MeteoHub")
              return result["remaining"]

          def request_observations():
              hour = datetime.fromisoformat(os.environ["VALID_HOUR_UTC"])
              deadline = datetime.fromisoformat(os.environ["DEADLINE_UTC"])
              name = f"enduro-precipitazioni-{hour:%Y%m%dT%H%MZ}"
              earliest = datetime.fromisoformat(os.environ["EARLIEST_REQUEST_UTC"])
              print(f"Finestra di misura fino alle {hour.isoformat()}. Controllo alle {earliest.isoformat()}.")
              while (seconds := (earliest - datetime.now(timezone.utc)).total_seconds()) > 0:
                  time.sleep(min(45, seconds))
              token = login()
              previous = api("/api/requests", token)
              if not isinstance(previous, list):
                  raise ValueError("Elenco richieste MeteoHub non valido")
              for item in previous:
                  if not isinstance(item, dict):
                      continue
                  args = item.get("args")
                  args = args if isinstance(args, dict) else {}
                  if name in (item.get("name"), item.get("request_name"), args.get("request_name")):
                      identifier = str(item.get("id", ""))
                      if identifier.isascii() and identifier.isdecimal():
                          print(f"Riutilizzo richiesta {identifier}")
                          return identifier

              payload = {
                  "request_name": name,
                  "reftime": {
                      "from": utc_string(hour - timedelta(hours=1) + timedelta(seconds=1)),
                      "to": utc_string(hour + timedelta(seconds=1)),
                  },
                  "output_format": "json",
                  "only_reliable": True,
                  "filters": {"product": [{"code": "B13011"}]},
              }

              announced_quota = None
              while (seconds := (deadline - datetime.now(timezone.utc)).total_seconds()) > 0:
                  try:
                      remaining = remaining_quota(token)
                  except urllib.error.HTTPError as error:
                      if error.code != 401:
                          raise
                      token = login()
                      remaining = remaining_quota(token)
                  if remaining != announced_quota:
                      print(f"Slot orari MeteoHub disponibili: {remaining}")
                      announced_quota = remaining
                  if remaining > 0:
                      token = login()
                      storage = api("/api/usage", token)
                      regions = [region for region, _ in REGIONS_BY_EXTRACT_SIZE]
                      if isinstance(storage, dict) and (
                          isinstance(storage.get("quota"), int)
                          and isinstance(storage.get("used"), int)
                      ):
                          free = storage["quota"] - storage["used"]
                          print(f"Spazio libero MeteoHub: {free} byte")
                          if free <= 0:
                              raise RuntimeError("Spazio MeteoHub esaurito")
                          regions = []
                          estimated_bytes = 0
                          for region, previous_size in REGIONS_BY_EXTRACT_SIZE:
                              if (estimated_bytes + previous_size) * 1.20 > free:
                                  break
                              regions.append(region)
                              estimated_bytes += previous_size
                          if not regions:
                              regions.append(REGIONS_BY_EXTRACT_SIZE[0][0])
                      print(f"Reti richieste: {', '.join(regions)}")
                      payload["dataset_names"] = regions
                      try:
                          result = api("/api/data", token, payload)
                      except urllib.error.HTTPError as error:
                          if error.code not in (401, 429) or remaining_quota(token) > 0:
                              raise
                      else:
                          identifier = str(result.get("request_id") or result.get("id") or "") if isinstance(result, dict) else ""
                          if not (identifier.isascii() and identifier.isdecimal()):
                              raise RuntimeError("MeteoHub non ha confermato l'ID della richiesta")
                          print(f"Richiesta congiunta {identifier}")
                          return identifier
                  remaining_time = (deadline - datetime.now(timezone.utc)).total_seconds()
                  time.sleep(max(0, min(60, remaining_time)))
              raise RuntimeError("Quota oraria esaurita fino al termine di questo tentativo")

          identifier = request_observations()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"id={identifier}\n")
          PY

      - name: Collect the regional extract
        env:
          METEOHUB_USERNAME: ${{ secrets.METEOHUB_USERNAME }}
          METEOHUB_PASSWORD: ${{ secrets.METEOHUB_PASSWORD }}
          REQUEST_ID: ${{ steps.request.outputs.id }}
        run: |
          mkdir -p targeted
          cd targeted
          python "$GITHUB_WORKSPACE/meteohub_collect.py" --request-ids "$REQUEST_ID" --wait-seconds 240

      - name: Clean and deduplicate observations
        working-directory: targeted
        run: python "$GITHUB_WORKSPACE/meteohub_clean.py"

      - name: Archive observations
        uses: actions/upload-artifact@v4
        with:
          name: meteohub-observations-${{ github.run_id }}
          path: targeted/data/observations/meteohub/
          if-no-files-found: error
          retention-days: 90

      - name: Archive request statuses on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: meteohub-request-status-${{ github.run_id }}
          path: targeted/data/observations/meteohub/collection_report.json
          if-no-files-found: ignore
          retention-days: 90
