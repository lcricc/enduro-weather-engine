
name: ENDURO MeteoHub Automatic Collection

on:
  workflow_dispatch:
    inputs:
      request_ids:
        description: "ID MeteoHub già esistenti, separati da virgola (vuoto = raccolta ordinaria)"
        required: false
        type: string
  schedule:
    - cron: "30 1,7,13,19 * * *"

permissions:
  contents: read

concurrency:
  group: enduro-meteohub-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Request fresh MeteoHub observations
        if: ${{ !inputs.request_ids }}
        env:
          METEOHUB_USERNAME: ${{ secrets.METEOHUB_USERNAME }}
          METEOHUB_PASSWORD: ${{ secrets.METEOHUB_PASSWORD }}
        run: python meteohub_request_all.py

      - name: Collect completed MeteoHub observations
        env:
          METEOHUB_USERNAME: ${{ secrets.METEOHUB_USERNAME }}
          METEOHUB_PASSWORD: ${{ secrets.METEOHUB_PASSWORD }}
          REQUEST_IDS: ${{ inputs.request_ids }}
        shell: bash
        run: |
          if [[ -n "$REQUEST_IDS" ]]; then
            mkdir -p targeted
            cd targeted
            python "$GITHUB_WORKSPACE/meteohub_collect.py" --request-ids "$REQUEST_IDS" --wait-seconds 240
          else
            python meteohub_collect.py
          fi

      - name: Clean and deduplicate observations
        working-directory: ${{ inputs.request_ids && 'targeted' || '.' }}
        run: python "$GITHUB_WORKSPACE/meteohub_clean.py"

      - name: Archive observations
        if: ${{ success() || (always() && !inputs.request_ids) }}
        uses: actions/upload-artifact@v4
        with:
          name: meteohub-observations-${{ github.run_id }}
          path: ${{ inputs.request_ids && 'targeted/data/observations/meteohub/' || 'data/observations/meteohub/' }}
          if-no-files-found: warn
          retention-days: 90

      - name: Upload MeteoHub request statuses on failure
        if: ${{ failure() && inputs.request_ids }}
        uses: actions/upload-artifact@v4
        with:
          name: meteohub-request-status-${{ github.run_id }}
          path: targeted/data/observations/meteohub/collection_report.json
          if-no-files-found: ignore
          retention-days: 90
