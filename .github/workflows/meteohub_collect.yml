name: ENDURO MeteoHub Automatic Collection

on:
  push:
    branches: [meteohub-primo-confronto]
    paths: [.github/workflows/meteohub_collect.yml]

permissions:
  actions: read
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 89575287681bf340220de6588f2104b0948f89b6
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Submit the published rain recovery plan
        id: recovery
        env:
          GH_TOKEN: ${{ github.token }}
          METEOHUB_USERNAME: ${{ secrets.METEOHUB_USERNAME }}
          METEOHUB_PASSWORD: ${{ secrets.METEOHUB_PASSWORD }}
          VALIDATION_RUN: "43766027938"
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$VALIDATION_RUN" --name "enduro-validation-$VALIDATION_RUN" --dir "$RUNNER_TEMP/rain-plan"
          python -u - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          import meteohub_rain_recovery as recovery

          plan = json.loads((Path(os.environ["RUNNER_TEMP"]) / "rain-plan/rain_recovery_plan.json").read_text())
          identifiers = []
          request = recovery.api

          def capture(path, token, payload=None):
              result = request(path, token, payload)
              if path == "/api/data":
                  identifier = str(result.get("request_id") or result.get("id") or "")
                  if not identifier.isascii() or not identifier.isdecimal():
                      raise ValueError("MeteoHub did not report a numeric request ID")
                  identifiers.append(identifier)
              return result

          recovery.api = capture
          recovery.submit(plan, datetime.now(timezone.utc))
          if not identifiers:
              raise RuntimeError("No new recovery request was submitted")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"ids={','.join(identifiers)}\n")
          PY

      - name: Collect recovered weather observations
        env:
          METEOHUB_USERNAME: ${{ secrets.METEOHUB_USERNAME }}
          METEOHUB_PASSWORD: ${{ secrets.METEOHUB_PASSWORD }}
          REQUEST_IDS: ${{ steps.recovery.outputs.ids }}
        run: |
          mkdir -p targeted
          cd targeted
          python "$GITHUB_WORKSPACE/meteohub_collect.py" --request-ids "$REQUEST_IDS" --wait-seconds 240

      - name: Clean weather observations
        working-directory: targeted
        run: python "$GITHUB_WORKSPACE/meteohub_clean.py"

      - name: Archive observations
        uses: actions/upload-artifact@v4
        with:
          name: meteohub-observations-${{ github.run_id }}
          path: targeted/data/observations/meteohub/
          if-no-files-found: error
          retention-days: 90
