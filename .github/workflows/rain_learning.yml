name: ENDURO Historical Rain Calibration
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/rain_learning.yml
  schedule:
    - cron: '35 6 * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/rain_learning.yml
      - calibrate_rain.py
      - rain_learning_sources.py
      - meteohub_approved_metadata.json
      - validate_meteohub.py
      - data/geography/**
permissions:
  contents: read
  actions: read
concurrency:
  group: enduro-historical-rain-calibration-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false
jobs:
  learn:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}
          persist-credentials: false
      - name: Record calibration input commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install duckdb==1.4.3 pytz==2025.2
      - run: python -m unittest discover -s tests -p test_rain_learning.py
      - uses: actions/cache@v4
        with:
          path: .rain-cache/*.parquet
          key: rain-${{ hashFiles('calibrate_rain.py', 'meteohub_approved_metadata.json') }}-${{ github.run_id }}
          restore-keys: |
            rain-${{ hashFiles('calibrate_rain.py', 'meteohub_approved_metadata.json') }}-
      - name: Calibrate from all available station hours
        env:
          GH_TOKEN: ${{ github.token }}
        run: python rain_learning_sources.py
      - name: Upload calibration output for publication
        uses: actions/upload-artifact@v4
        with:
          name: rain-calibration-${{ github.run_id }}
          path: |
            rain-v01.json
            data/rain-learning/
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  publish:
    name: Publish versioned rain calibration
    needs: learn
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.learn.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/download-artifact@v4
        with:
          name: rain-calibration-${{ github.run_id }}
          path: ${{ runner.temp }}/rain-calibration
      - name: Verify downloaded calibration
        run: |
          set -euo pipefail
          calibration_dir="$RUNNER_TEMP/rain-calibration"
          python -m json.tool "$calibration_dir/rain-v01.json" > /dev/null
          python -m json.tool "$calibration_dir/data/rain-learning/sources.json" > /dev/null
          cp -a "$calibration_dir/." .
      - name: Publish calibration and preserve partial-run evidence
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git add rain-v01.json data/rain-learning/
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Aggiorna la calibrazione ENDURO sullo storico MeteoHub'
          git pull --rebase origin main
          git push origin HEAD:main
