
name: ENDURO observations collection

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: enduro-observations
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Collect observations
        run: python collect_observations.py

      - name: Save observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/observations/
          if ! git diff --cached --quiet; then
            git commit -m "Update national observations"
            git push
          else
            echo "No observation changes"
          fi
