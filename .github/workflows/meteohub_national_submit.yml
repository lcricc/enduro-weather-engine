
name: MeteoHub - Invio nazionale automatico

on:
  workflow_dispatch:
  schedule:
    - cron: "10 2,8,14,20 * * *"

permissions:
  contents: read

concurrency:
  group: meteohub-national-submit
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Invia richieste nazionali senza duplicati
        env:
          METEOHUB_USERNAME: ${{ secrets.METEOHUB_USERNAME }}
          METEOHUB_PASSWORD: ${{ secrets.METEOHUB_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          import json
          import copy
          import time
          import urllib.request
          import urllib.error
          from pathlib import Path
          from datetime import datetime, timedelta, timezone

          BASE = "https://meteohub.agenziaitaliameteo.it"
          OUT = Path("national_submit")
          OUT.mkdir(exist_ok=True)

          MAX_NEW = 8
          REFERENCE_ID = "5835976"

          def api(path, token=None, payload=None):
              headers = {"Accept": "application/json"}
              if token:
                  headers["Authorization"] = "Bearer " + token

              data = None
              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
                  headers["Content-Type"] = "application/json"

              req = urllib.request.Request(
                  BASE + path,
                  data=data,
                  headers=headers,
                  method="POST" if data is not None else "GET"
              )

              with urllib.request.urlopen(
                  req, timeout=90
              ) as response:
                  body = response.read()
                  if not body:
                      return {}
                  return json.loads(body)

          login = api(
              "/auth/login",
              payload={
                  "username": os.environ["METEOHUB_USERNAME"],
                  "password": os.environ["METEOHUB_PASSWORD"]
              }
          )

          token = (
              login if isinstance(login, str)
              else login.get("access_token")
              or login.get("token")
          )

          if not token:
              raise RuntimeError("Autenticazione fallita")

          datasets = api("/api/datasets", token)
          requests = api("/api/requests", token)

          if not isinstance(datasets, list):
              raise RuntimeError("Catalogo non valido")

          if not isinstance(requests, list):
              raise RuntimeError("Elenco richieste non valido")

          reference = next(
              (
                  r for r in requests
                  if isinstance(r, dict)
                  and str(r.get("id")) == REFERENCE_ID
              ),
              None
          )

          if not reference or not isinstance(
              reference.get("args"), dict
          ):
              raise RuntimeError(
                  "Richiesta di riferimento mancante"
              )

          obs = sorted({
              d["id"]
              for d in datasets
              if isinstance(d, dict)
              and d.get("category") == "OBS"
              and isinstance(d.get("id"), str)
          })

          if not obs:
              raise RuntimeError(
                  "Nessuna rete osservativa trovata"
              )

          now = datetime.now(timezone.utc)

          # Ultimo giorno UTC completo con
          # un giorno di ritardo di pubblicazione.
          end = now.replace(
              hour=0, minute=0,
              second=0, microsecond=0
          ) - timedelta(days=1)

          start = end - timedelta(days=1)

          date_tag = start.strftime("%Y%m%d")

          start_iso = start.strftime(
              "%Y-%m-%dT%H:%M:%SZ"
          )
          end_iso = end.strftime(
              "%Y-%m-%dT%H:%M:%SZ"
          )

          def normalize_time(value):
              if not isinstance(value, str):
                  return ""
              try:
                  dt = datetime.fromisoformat(
                      value.replace("Z", "+00:00")
                  )
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=timezone.utc)
                  return dt.astimezone(
                      timezone.utc
                  ).isoformat()
              except ValueError:
                  return value

          def get_names(r):
              args = r.get("args")
              if not isinstance(args, dict):
                  args = {}

              names = []
              for value in (
                  r.get("name"),
                  r.get("request_name"),
                  args.get("request_name")
              ):
                  if isinstance(value, str):
                      names.append(value)
              return names

          def matching_request(r, dataset, name):
              if not isinstance(r, dict):
                  return False

              if name in get_names(r):
                  return True

              args = r.get("args")
              if not isinstance(args, dict):
                  return False

              ds = args.get("dataset_names")
              if isinstance(ds, str):
                  ds = [ds]

              if not isinstance(ds, list):
                  return False

              if dataset not in ds:
                  return False

              period = args.get("reftime")
              if not isinstance(period, dict):
                  return False

              return (
                  normalize_time(period.get("from"))
                  == normalize_time(start_iso)
                  and
                  normalize_time(period.get("to"))
                  == normalize_time(end_iso)
              )

          report = {
              "generated_at": now.isoformat(),
              "period": {
                  "from": start_iso,
                  "to": end_iso
              },
              "networks": len(obs),
              "existing_requests": len(requests),
              "results": []
          }

          submitted = 0
          stopped = False

          for dataset in obs:
              name = (
                  "ENDURO_NATIONAL_"
                  + dataset.upper().replace("-", "_")
                  + "_" + date_tag
              )

              entry = {
                  "dataset": dataset,
                  "request_name": name
              }

              if any(
                  matching_request(r, dataset, name)
                  for r in requests
              ):
                  entry["status"] = "already_exists"
                  report["results"].append(entry)
                  continue

              if submitted >= MAX_NEW:
                  entry["status"] = "queued"
                  report["results"].append(entry)
                  continue

              if stopped:
                  entry["status"] = "paused"
                  report["results"].append(entry)
                  continue

              args = copy.deepcopy(reference["args"])
              args["dataset_names"] = [dataset]
              args["reftime"] = {
                  "from": start_iso,
                  "to": end_iso
              }

              payload = {
                  **args,
                  "request_name": name
              }

              try:
                  response = api(
                      "/api/data",
                      token,
                      payload=payload
                  )

                  if isinstance(response, dict):
                      request_id = (
                          response.get("request_id")
                          or response.get("id")
                      )
                  else:
                      request_id = None

                  if request_id is None:
                      entry["status"] = "unconfirmed"
                      stopped = True
                  else:
                      entry["status"] = "submitted"
                      entry["request_id"] = request_id
                      submitted += 1

                      # Protegge anche da duplicati
                      # nella stessa esecuzione.
                      requests.append({
                          "id": request_id,
                          "name": name,
                          "args": args
                      })

                      time.sleep(2)

              except urllib.error.HTTPError as error:
                  entry["status"] = "http_error"
                  entry["http_code"] = error.code

                  if error.code in (401, 403, 429):
                      stopped = True

              except Exception as error:
                  entry["status"] = "unknown_result"
                  entry["error_type"] = type(error).__name__
                  stopped = True

              report["results"].append(entry)
              print(dataset, entry["status"])

          report["submitted_count"] = submitted
          report["stopped_early"] = stopped

          destination = OUT / "national_submit_report.json"
          destination.write_text(
              json.dumps(
                  report,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print("Reti:", len(obs))
          print("Nuove richieste:", submitted)
          print("Report:", destination)
          PY

      - name: Conserva rapporto invii
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meteohub-national-submit-report
          path: national_submit/
          if-no-files-found: warn
          retention-days: 90
