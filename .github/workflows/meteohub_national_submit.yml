
name: MeteoHub - Invio nazionale automatico

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meteohub-national-submit
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Gestisci invii nazionali
        env:
          METEOHUB_USERNAME: ${{ secrets.METEOHUB_USERNAME }}
          METEOHUB_PASSWORD: ${{ secrets.METEOHUB_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          import json
          import copy
          import time
          import urllib.request
          import urllib.error
          from pathlib import Path
          from datetime import datetime, timedelta, timezone

          BASE = "https://meteohub.agenziaitaliameteo.it"
          OUT = Path("national_submit")
          OUT.mkdir(exist_ok=True)

          MAX_NEW = 8
          REFERENCE_ID = "5835976"

          def api(path, token=None, payload=None):
              headers = {"Accept": "application/json"}

              if token:
                  headers["Authorization"] = "Bearer " + token

              body = None
              if payload is not None:
                  body = json.dumps(payload).encode("utf-8")
                  headers["Content-Type"] = "application/json"

              req = urllib.request.Request(
                  BASE + path,
                  data=body,
                  headers=headers,
                  method="POST" if body is not None else "GET"
              )

              with urllib.request.urlopen(
                  req, timeout=90
              ) as response:
                  content = response.read()
                  return json.loads(content) if content else {}

          def authenticate():
              login = api(
                  "/auth/login",
                  payload={
                      "username": os.environ["METEOHUB_USERNAME"],
                      "password": os.environ["METEOHUB_PASSWORD"]
                  }
              )
              if isinstance(login, str):
                  token = login
              elif isinstance(login, dict):
                  token = (
                      login.get("access_token")
                      or login.get("token")
                  )
              else:
                  token = None

              if not token:
                  raise RuntimeError("Autenticazione fallita")
              return token

          token = authenticate()
          datasets = api("/api/datasets", token)
          requests = api("/api/requests", token)

          if not isinstance(datasets, list):
              raise RuntimeError("Catalogo non valido")
          if not isinstance(requests, list):
              raise RuntimeError("Elenco richieste non valido")

          reference = next(
              (
                  r for r in requests
                  if isinstance(r, dict)
                  and str(r.get("id")) == REFERENCE_ID
              ),
              None
          )

          if not reference or not isinstance(
              reference.get("args"), dict
          ):
              raise RuntimeError("Richiesta di riferimento mancante")

          networks = sorted({
              d["id"]
              for d in datasets
              if isinstance(d, dict)
              and d.get("category") == "OBS"
              and isinstance(d.get("id"), str)
          })

          now = datetime.now(timezone.utc)
          end = now.replace(
              hour=0, minute=0,
              second=0, microsecond=0
          ) - timedelta(days=1)
          start = end - timedelta(days=1)

          start_iso = start.strftime("%Y-%m-%dT%H:%M:%SZ")
          end_iso = end.strftime("%Y-%m-%dT%H:%M:%SZ")
          date_tag = start.strftime("%Y%m%d")

          def normalized_time(value):
              if not isinstance(value, str):
                  return ""
              try:
                  dt = datetime.fromisoformat(
                      value.replace("Z", "+00:00")
                  )
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=timezone.utc)
                  return dt.astimezone(timezone.utc).isoformat()
              except ValueError:
                  return value

          def exists(dataset, name):
              for r in requests:
                  if not isinstance(r, dict):
                      continue

                  args = r.get("args")
                  if not isinstance(args, dict):
                      args = {}

                  names = [
                      r.get("name"),
                      r.get("request_name"),
                      args.get("request_name")
                  ]

                  if name in names:
                      return True

                  ds = args.get("dataset_names")
                  if isinstance(ds, str):
                      ds = [ds]

                  period = args.get("reftime")

                  if (
                      isinstance(ds, list)
                      and dataset in ds
                      and isinstance(period, dict)
                      and normalized_time(period.get("from"))
                          == normalized_time(start_iso)
                      and normalized_time(period.get("to"))
                          == normalized_time(end_iso)
                  ):
                      return True

              return False

          report = {
              "generated_at": now.isoformat(),
              "period": {
                  "from": start_iso,
                  "to": end_iso
              },
              "networks_found": len(networks),
              "results": []
          }

          submitted = 0
          stopped = False

          for dataset in networks:
              name = (
                  "ENDURO_NATIONAL_"
                  + dataset.upper().replace("-", "_")
                  + "_" + date_tag
              )

              entry = {
                  "dataset": dataset,
                  "request_name": name
              }

              if exists(dataset, name):
                  entry["status"] = "already_exists"
                  report["results"].append(entry)
                  continue

              if stopped:
                  entry["status"] = "paused"
                  report["results"].append(entry)
                  continue

              if submitted >= MAX_NEW:
                  entry["status"] = "queued"
                  report["results"].append(entry)
                  continue

              args = copy.deepcopy(reference["args"])
              args["dataset_names"] = [dataset]
              args["reftime"] = {
                  "from": start_iso,
                  "to": end_iso
              }

              payload = {
                  **args,
                  "request_name": name
              }

              try:
                  response = api(
                      "/api/data", token, payload
                  )

                  request_id = None
                  if isinstance(response, dict):
                      request_id = (
                          response.get("request_id")
                          or response.get("id")
                      )

                  if request_id is None:
                      entry["status"] = "unconfirmed"
                      stopped = True
                  else:
                      entry["status"] = "submitted"
                      entry["request_id"] = request_id
                      submitted += 1

                      requests.append({
                          "id": request_id,
                          "name": name,
                          "args": args
                      })

                      time.sleep(2)

              except urllib.error.HTTPError as error:
                  entry["http_code"] = error.code

                  if error.code == 401:
                      # Controlla se il token è ancora valido.
                      try:
                          api("/api/requests", token)
                          entry["status"] = "rejected_401"
                          # Autenticazione GET valida:
                          # possibile rifiuto del dataset.
                          # Non riprovare questa rete.
                      except Exception:
                          entry["status"] = "auth_failure"
                          stopped = True

                  elif error.code in (400, 403, 404, 422):
                      entry["status"] = "rejected"

                  elif error.code == 429:
                      entry["status"] = "rate_limited"
                      stopped = True

                  else:
                      entry["status"] = "http_error"
                      stopped = True

              except Exception as error:
                  entry["status"] = "unknown_result"
                  entry["error_type"] = type(error).__name__
                  stopped = True

              report["results"].append(entry)
              print(dataset, entry["status"])

          report["submitted_count"] = submitted
          report["stopped_early"] = stopped

          (OUT / "national_submit_report.json").write_text(
              json.dumps(
                  report,
                  indent=2,
                  ensure_ascii=False
              ),
              encoding="utf-8"
          )

          print("Reti:", len(networks))
          print("Nuove richieste:", submitted)
          print("Esecuzione terminata")
          PY

      - name: Conserva rapporto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meteohub-national-submit-report
          path: national_submit/
          if-no-files-found: warn
          retention-days: 90
