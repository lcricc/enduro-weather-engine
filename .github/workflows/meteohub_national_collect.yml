
name: MeteoHub - Archivio nazionale

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: meteohub-national-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepara cartelle
        run: |
          mkdir -p data/observations/meteohub
          mkdir -p data/observations/normalized

      - name: Scarica estrazioni completate
        env:
          METEOHUB_USERNAME: ${{ secrets.METEOHUB_USERNAME }}
          METEOHUB_PASSWORD: ${{ secrets.METEOHUB_PASSWORD }}
        run: |
          python meteohub_collect.py

      - name: Normalizza osservazioni
        run: |
          python meteohub_normalize.py \
            data/observations/meteohub \
            --output data/observations/normalized

      - name: Salva dati nel repository
        run: |
          git config user.name "enduro-weather-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A data/observations/meteohub
          git add -A data/observations/normalized

          if git diff --cached --quiet; then
            echo "Nessun nuovo dato da salvare"
          else
            git commit -m "Aggiorna osservazioni MeteoHub"
            git push
          fi

      - name: Conserva copia di sicurezza
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meteohub-archivio-nazionale
          path: |
            data/observations/meteohub/
            data/observations/normalized/
          if-no-files-found: warn
          retention-days: 90
