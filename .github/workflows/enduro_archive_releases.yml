
name: ENDURO Permanent Archive

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - ENDURO MeteoHub Automatic Collection
      - ENDURO MeteoHub Forecasts V2
    types:
      - completed

permissions:
  contents: write
  actions: read

concurrency:
  group: enduro-permanent-archive
  cancel-in-progress: false

jobs:
  archive:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Archive completed collections
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"

          latest_run() {
            gh run list \
              --repo "$REPO" \
              --workflow "$1" \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId'
          }

          archive_one() {
            local kind="$1"
            local run_id="$2"
            local pattern="$3"
            local expected="$4"

            test -n "$run_id" || {
              echo "Missing run ID for $kind"
              exit 1
            }

            local tag="meteohub-${kind}-${run_id}"

            if gh release view "$tag" \
              --repo "$REPO" >/dev/null 2>&1; then
              echo "Already archived: $tag"
              return 0
            fi

            local work="$RUNNER_TEMP/archive-${kind}-${run_id}"
            mkdir -p "$work/data" "$work/out"

            gh run download "$run_id" \
              --repo "$REPO" \
              --pattern "$pattern" \
              --dir "$work/data"

            local found
            found=$(find "$work/data" \
              -type f -name "$expected" -print -quit)

            test -n "$found" || {
              echo "Required file missing: $expected"
              exit 1
            }

            test -s "$found" || {
              echo "Required file empty: $found"
              exit 1
            }

            tar -czf "$work/out/${kind}-${run_id}.tar.gz" \
              -C "$work" data

            test -s "$work/out/${kind}-${run_id}.tar.gz"

            (
              cd "$work/out"
              sha256sum "${kind}-${run_id}.tar.gz" \
                > "${kind}-${run_id}.sha256"
              sha256sum -c "${kind}-${run_id}.sha256"
            )

            gh release create "$tag" \
              "$work/out/${kind}-${run_id}.tar.gz" \
              "$work/out/${kind}-${run_id}.sha256" \
              --repo "$REPO" \
              --target "$GITHUB_SHA" \
              --title "ENDURO MeteoHub $kind run $run_id" \
              --notes "MeteoHub $kind archive from successful Actions run $run_id. SHA-256 checksum included." \
              --latest=false

            echo "Archived: $tag"
          }

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            OBS_RUN=$(latest_run meteohub_collect.yml)
            FC_RUN=$(latest_run enduro_meteohub_forecasts.yml)

            archive_one observations "$OBS_RUN" \
              'meteohub-observations-*' observations_clean.csv

            archive_one forecasts "$FC_RUN" \
              'enduro-meteohub-forecasts-*' \
              'forecasts_meteohub_*.csv.gz'

          elif [ "$SOURCE_WORKFLOW" = "ENDURO MeteoHub Automatic Collection" ]; then
            archive_one observations "$SOURCE_RUN_ID" \
              'meteohub-observations-*' observations_clean.csv

          elif [ "$SOURCE_WORKFLOW" = "ENDURO MeteoHub Forecasts V2" ]; then
            archive_one forecasts "$SOURCE_RUN_ID" \
              'enduro-meteohub-forecasts-*' \
              'forecasts_meteohub_*.csv.gz'

          else
            echo "Unrecognized source workflow: $SOURCE_WORKFLOW"
            exit 1
          fi
