
name: ENDURO MeteoHub National Inventory

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read MeteoHub national datasets
        env:
          METEOHUB_USERNAME: ${{ secrets.METEOHUB_USERNAME }}
          METEOHUB_PASSWORD: ${{ secrets.METEOHUB_PASSWORD }}
        run: python meteohub_inventory.py

      - name: Archive inventory
        uses: actions/upload-artifact@v4
        with:
          name: meteohub-national-inventory
          path: data/observations/meteohub/national_inventory.json
          retention-days: 90
          if-no-files-found: error
