
name: ENDURO Observation Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Retrieve forecast archive
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin forecast-archive
          mkdir -p data/forecasts/national
          git archive FETCH_HEAD data/forecasts/national | tar -xf -

      - name: Diagnose observation coverage
        run: python diagnose_observation_coverage.py

      - name: Save diagnostic report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/diagnostics/observation_coverage_latest.json

          if ! git diff --cached --quiet; then
            git commit -m "Update observation coverage diagnostics"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observation-coverage
          path: data/diagnostics/observation_coverage_latest.json
          if-no-files-found: warn
