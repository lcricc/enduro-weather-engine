
name: ENDURO Observation Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download historical MeteoHub archives
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p historical/observations
          mkdir -p historical/forecasts

          gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 100 \
            --json tagName \
            --jq '.[].tagName' \
            > /tmp/enduro_tags.txt

          OBS_COUNT=0
          FC_COUNT=0

          while IFS= read -r TAG; do
            case "$TAG" in
              meteohub-observations-*)
                DEST="historical/observations/$TAG"
                KIND="observations"
                OBS_COUNT=$((OBS_COUNT + 1))
                ;;
              meteohub-forecasts-*)
                DEST="historical/forecasts/$TAG"
                KIND="forecasts"
                FC_COUNT=$((FC_COUNT + 1))
                ;;
              *)
                continue
                ;;
            esac

            mkdir -p "$DEST"

            gh release download "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$KIND-*.tar.gz" \
              --dir "$DEST"

            for FILE in "$DEST"/*.tar.gz; do
              test -f "$FILE" || continue
              tar -xzf "$FILE" -C "$DEST"
            done

          done < /tmp/enduro_tags.txt

          echo "Observation archives: $OBS_COUNT"
          echo "Forecast archives: $FC_COUNT"

          test "$OBS_COUNT" -gt 0
          test "$FC_COUNT" -gt 0

      - name: Diagnose MeteoHub coverage
        run: python diagnose_observation_coverage.py

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meteohub-coverage-${{ github.run_id }}
          path: data/diagnostics/observation_coverage_latest.json
          if-no-files-found: error
          retention-days: 90
